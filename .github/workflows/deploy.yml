# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Force all JavaScript actions to run on Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build & Sync Catalog with MongoDB Atlas
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Ensure CNAME exists in dist if configured
        run: |
          if [ -f "public/CNAME" ] && [ ! -f "dist/CNAME" ]; then
            cp public/CNAME dist/CNAME
          elif [ -f "CNAME" ] && [ ! -f "dist/CNAME" ]; then
            cp CNAME dist/CNAME
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: dist/index.html missing"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
